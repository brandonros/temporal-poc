---
# Keep Service and Secret names aligned with values/temporal.yaml.
fullnameOverride: temporal-pg

type: postgresql
mode: standalone

version:
  postgresql: "18"

cluster:
  instances: 1

  # Pin the patch version; version.postgresql selects a floating major tag.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie

  storage:
    size: 20Gi
    storageClass: local-path

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi

  initdb:
    database: temporal
    owner: temporal

  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: 256MB

  monitoring:
    enabled: true
    podMonitor:
      enabled: true

  primaryUpdateStrategy: unsupervised

# initdb creates `temporal`; Temporal needs a second database too.
databases:
  - name: temporal_visibility
    owner: temporal
    ensure: present
    databaseReclaimPolicy: retain

backups:
  enabled: false

---
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: s3
    bucketNames:
      chunks: loki-chunks
      ruler: loki-ruler
    s3:
      endpoint: http://seaweedfs-all-in-one.storage.svc.cluster.local:8333
      region: us-east-1
      accessKeyId: temporal-poc
      secretAccessKey: temporal-poc-local-s3
      s3ForcePathStyle: true
      insecure: true
  limits_config:
    retention_period: 168h
  compactor:
    retention_enabled: true
    delete_request_store: s3
    working_directory: /var/loki/compactor
  analytics:
    reporting_enabled: false

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: local-path
    size: 5Gi
    enableStatefulSetAutoDeletePVC: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
# Direct access to the single Loki service; no extra proxy or cache pods.
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false

---
kubeApiServer:
  enabled: true

kubelet:
  enabled: true
  serviceMonitor:
    cAdvisor: true
    probes: true
    resource: true
    # The chart's /metrics/resource/v1alpha1 default returns 404 on k3s 1.36.
    resourcePath: "/metrics/resource"

# k3s runs these in one process and doesn't expose them on the expected ports.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

defaultRules:
  create: true
  rules:
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeProxy: false
    etcd: false

prometheus:
  prometheusSpec:
    # Discover monitors from other releases, not just kube-prometheus-stack.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false

    retention: 15d
    scrapeInterval: 30s
    evaluationInterval: 30s

    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        memory: 2Gi

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - prometheus.127.0.0.1.sslip.io
    paths:
      - /

  # Scrape Traefik's metrics entrypoint for the HTTP autoscaling queries.
  additionalPodMonitors:
    - name: traefik
      podMetricsEndpoints:
        - port: metrics
          path: /metrics
          interval: 15s
      namespaceSelector:
        matchNames: ["kube-system"]
      selector:
        matchLabels:
          app.kubernetes.io/name: traefik

grafana:
  enabled: true
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
    - name: Tempo
      uid: tempo
      type: tempo
      access: proxy
      url: http://tempo.monitoring.svc.cluster.local:3200
      jsonData:
        nodeGraph:
          enabled: true
  adminPassword: prom-operator
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.127.0.0.1.sslip.io
    path: /
  persistence:
    enabled: true
    storageClassName: local-path
    size: 5Gi
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

alertmanager:
  enabled: true
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - alertmanager.127.0.0.1.sslip.io
    paths:
      - /
  alertmanagerSpec:
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 256Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

prometheus-node-exporter:
  enabled: true

kube-state-metrics:
  enabled: true

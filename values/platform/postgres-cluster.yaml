---
# Keep Service and Secret names aligned with temporal.yaml.
fullnameOverride: temporal-pg

type: postgresql
mode: standalone

version:
  postgresql: "18"

cluster:
  instances: 1

  # Pin the patch version; version.postgresql selects a floating major tag.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie

  storage:
    size: 20Gi
    storageClass: local-path

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi

  initdb:
    database: temporal
    owner: temporal

  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: 256MB

  monitoring:
    enabled: true
    podMonitor:
      enabled: true

  primaryUpdateStrategy: unsupervised

# initdb creates `temporal`; Temporal needs a second database too.
databases:
  - name: temporal_visibility
    owner: temporal
    ensure: present
    databaseReclaimPolicy: retain

  - name: saga
    owner: temporal
    ensure: present
    databaseReclaimPolicy: retain

backups:
  enabled: true
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  provider: s3
  endpointURL: http://seaweedfs-all-in-one.storage.svc.cluster.local:8333
  s3:
    region: us-east-1
    bucket: postgres-backups
    accessKey: temporal-poc
    secretKey: temporal-poc-local-s3
  retentionPolicy: 7d
  # SeaweedFS stores these locally; do not request AWS KMS/SSE encryption.
  wal:
    compression: gzip
    encryption: ""
  data:
    compression: gzip
    encryption: ""
    jobs: 1
  instanceSidecarConfiguration:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
  scheduledBackups:
    - name: daily
      schedule: "0 0 2 * * *"
      backupOwnerReference: self
      method: plugin
      pluginConfiguration:
        name: barman-cloud.cloudnative-pg.io

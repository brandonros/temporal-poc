---
# KEDA allows one ScaledObject per scaleTargetRef, so both triggers live here.
# It scales to the highest replica count any trigger asks for.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ .Values.worker.name }}
  namespace: {{ .Release.Namespace }}
spec:
  scaleTargetRef:
    name: {{ .Values.worker.name }}
  pollingInterval: {{ .Values.scaling.pollingInterval }}
  cooldownPeriod: {{ .Values.scaling.cooldownPeriod }}
  minReplicaCount: {{ .Values.scaling.minReplicas }}
  maxReplicaCount: {{ .Values.scaling.maxReplicas }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 60
  triggers:
    - type: temporal
      metadata:
        endpoint: {{ .Values.temporal.endpoint | quote }}
        namespace: {{ .Values.temporal.namespace | quote }}
        taskQueue: {{ .Values.temporal.taskQueue | quote }}
        targetQueueSize: {{ .Values.scaling.targetQueueSize | quote }}
        activationTargetQueueSize: {{ .Values.scaling.activationTargetQueueSize | quote }}
        queueTypes: "workflow,activity"

    - type: prometheus
      metadata:
        serverAddress: {{ .Values.prometheus.serverAddress | quote }}
        threshold: {{ .Values.scaling.latencyThreshold | quote }}
        query: >-
          histogram_quantile(0.95,
            sum(rate(
              temporal_activity_schedule_to_start_latency_bucket{
                namespace="{{ .Values.temporal.namespace }}",
                taskqueue="{{ .Values.temporal.taskQueue }}"
              }[2m]
            )) by (le)
          )
        activationThreshold: "0.1"
        ignoreNullValues: "true"

{{- if .Values.nexus.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.nexus.worker.name }}-src
  namespace: {{ .Release.Namespace }}
data:
  nexus_worker.py: |
{{ .Files.Get "apps/nexus-worker/nexus_worker.py" | indent 4 }}
---
# --- handler side: serves GreetService in the `poc` namespace ---------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.nexus.worker.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.nexus.worker.name }}
spec:
  # replicas intentionally unset: KEDA owns it.
  selector:
    matchLabels:
      app: {{ .Values.nexus.worker.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.nexus.worker.name }}
      annotations:
        checksum/src: {{ .Files.Get "apps/nexus-worker/nexus_worker.py" | sha256sum }}
    spec:
      containers:
        - name: worker
          image: {{ .Values.image }}
          command: ["/bin/sh", "-c"]
          args:
            - pip install --no-cache-dir --quiet {{ .Values.pipPackages }} && exec python /app/nexus_worker.py
          env:
            - name: TEMPORAL_ADDRESS
              value: {{ .Values.temporal.endpoint | quote }}
            - name: TEMPORAL_NAMESPACE
              value: {{ .Values.nexus.handlerNamespace | quote }}
            - name: TEMPORAL_TASK_QUEUE
              value: {{ .Values.nexus.handlerTaskQueue | quote }}
            - name: NEXUS_ENDPOINT
              value: {{ .Values.nexus.endpoint | quote }}
            - name: GREET_SECONDS
              value: {{ .Values.worker.greetSeconds | quote }}
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - name: src
              mountPath: /app
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
      volumes:
        - name: src
          configMap:
            name: {{ .Values.nexus.worker.name }}-src
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.nexus.api.name }}-src
  namespace: {{ .Release.Namespace }}
data:
  nexus_api.py: |
{{ .Files.Get "apps/nexus-api/nexus_api.py" | indent 4 }}
---
# --- caller side: its own namespace, knows only the endpoint name -----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.nexus.api.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.nexus.api.name }}
spec:
  # replicas intentionally unset: KEDA owns it.
  selector:
    matchLabels:
      app: {{ .Values.nexus.api.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.nexus.api.name }}
      annotations:
        checksum/src: {{ .Files.Get "apps/nexus-api/nexus_api.py" | sha256sum }}
    spec:
      containers:
        - name: api
          image: {{ .Values.image }}
          command: ["/bin/sh", "-c"]
          args:
            - pip install --no-cache-dir --quiet {{ .Values.pipPackages }} && exec python /app/nexus_api.py
          ports:
            - name: http
              containerPort: {{ .Values.nexus.api.port }}
          env:
            - name: TEMPORAL_ADDRESS
              value: {{ .Values.temporal.endpoint | quote }}
            - name: TEMPORAL_NAMESPACE
              value: {{ .Values.nexus.callerNamespace | quote }}
            - name: TEMPORAL_TASK_QUEUE
              value: {{ .Values.nexus.callerTaskQueue | quote }}
            - name: NEXUS_ENDPOINT
              value: {{ .Values.nexus.endpoint | quote }}
            - name: PORT
              value: {{ .Values.nexus.api.port | quote }}
            - name: PYTHONUNBUFFERED
              value: "1"
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: src
              mountPath: /app
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
      volumes:
        - name: src
          configMap:
            name: {{ .Values.nexus.api.name }}-src
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.nexus.api.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.nexus.api.name }}
spec:
  selector:
    app: {{ .Values.nexus.api.name }}
  ports:
    - name: http
      port: {{ .Values.nexus.api.port }}
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.nexus.api.name }}
  namespace: {{ .Release.Namespace }}
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .Values.nexus.api.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.nexus.api.name }}
                port:
                  number: {{ .Values.nexus.api.port }}
---
{{- include "scalingdemo.scaledobject" (dict
      "name" .Values.nexus.worker.name "ns" .Release.Namespace
      "s" .Values.nexus.worker.scaling "kind" "temporal"
      "endpoint" .Values.temporal.endpoint
      "tns" .Values.nexus.handlerNamespace
      "queue" .Values.nexus.handlerTaskQueue) }}
---
{{- include "scalingdemo.scaledobject" (dict
      "name" .Values.nexus.api.name "ns" .Release.Namespace
      "s" .Values.nexus.api.scaling "kind" "traefik"
      "prom" .Values.prometheus.serverAddress
      "port" .Values.nexus.api.port) }}
{{- end }}

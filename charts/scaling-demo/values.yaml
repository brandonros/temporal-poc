---
# No image build: a stock python image pip-installs at startup and runs the
# source mounted from a ConfigMap. Costs ~30-45s of pod startup.
image: python:3.12-slim
pipPackages: "temporalio==1.18.1 aiohttp==3.13.2 prometheus-client==0.24.1"

temporal:
  endpoint: temporal-frontend.temporal.svc.cluster.local:7233
  namespace: poc
  taskQueue: poc-task-queue

prometheus:
  serverAddress: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090

# Every workload below is scaled by a KEDA ScaledObject and nothing else — no
# Deployment in this chart sets `replicas`. Handlers scale on Temporal task
# queue backlog; HTTP services scale on Traefik ingress req/s.

worker:
  name: poc-worker
  # Slow activity + low concurrency so a burst builds a visible backlog.
  greetSeconds: 5
  maxConcurrentActivities: 2
  scaling:
    minReplicas: 0
    maxReplicas: 6
    pollingInterval: 15
    cooldownPeriod: 60
    targetQueueSize: 5
    activationTargetQueueSize: 0

api:
  name: poc-api
  port: 8000
  host: api.127.0.0.1.sslip.io
  greetTimeoutSeconds: 180
  scaling:
    # Never zero: it has to be up to receive the request that creates work.
    minReplicas: 1
    maxReplicas: 5
    pollingInterval: 15
    cooldownPeriod: 60
    # requests/sec per replica (measured by Traefik at the ingress)
    requestsPerSecond: "1"

# Nexus demo: caller and handler in separate Temporal namespaces, connected
# only by the endpoint name.
nexus:
  enabled: true
  endpoint: greet-endpoint
  handlerNamespace: poc
  handlerTaskQueue: poc-nexus-queue
  callerNamespace: caller
  callerTaskQueue: caller-task-queue
  worker:
    name: nexus-worker
    scaling:
      # Cannot be zero. Temporal exposes backlog only for workflow/activity
      # task types, never nexus — so a Nexus request arriving at a zero-replica
      # handler creates no visible backlog, never wakes it, and times out.
      # Above 1 it still scales on the workflows those operations start.
      minReplicas: 1
      maxReplicas: 4
      pollingInterval: 15
      cooldownPeriod: 60
      targetQueueSize: 5
      activationTargetQueueSize: 0

  api:
    name: nexus-api
    port: 8000
    host: nexus.127.0.0.1.sslip.io
    scaling:
      minReplicas: 1
      maxReplicas: 4
      pollingInterval: 15
      cooldownPeriod: 60
      requestsPerSecond: "1"
